name: Run Scalp Engine & Publish to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"      # best-effort: GitHub bisa menunda beberapa menit
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Profil strategi: 'strategy' (default) atau 'strategy.spot' (biaya spot, tanpa short, tanpa leverage).
  # Ubah lewat Settings -> Secrets and variables -> Actions -> Variables -> STRATEGY_PROFILE.
  # PERHATIAN: mengganti profil = hash strategi berubah = epoch forward-test BARU.
  STRATEGY_PROFILE: ${{ vars.STRATEGY_PROFILE || 'strategy' }}

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      # Tes menjadi gerbang saat kode berubah (push/manual). Run terjadwal tidak diblok tes
      # supaya satu tes rapuh tidak mematikan pemantauan; kode tidak berubah antar run terjadwal.
      - name: Run unit tests
        if: github.event_name != 'schedule'
        run: python -m pytest -q

      - name: Run scalp engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          mkdir -p data _site
          python -m scalp --config "config/${STRATEGY_PROFILE}.json" --data-dir data --site-src site --site-out _site run

      - name: Verify journal chain
        run: python -m scalp --config "config/${STRATEGY_PROFILE}.json" --data-dir data verify

      - name: Build site
        run: python -m scalp --config "config/${STRATEGY_PROFILE}.json" --data-dir data --site-src site --site-out _site build-site

      # SATU sumber kebenaran = git. Hanya jurnal (dan brief AI) yang perlu dipersist; state/market dibuat ulang tiap run.
      # Kegagalan menyimpan jurnal = run GAGAL (tidak ada deploy), bukan peringatan yang terlewat.
      - name: Persist journal to repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/journal.jsonl data/brief.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "jurnal tidak berubah"
            exit 0
          fi
          git commit -m "chore: update scalp journal [skip ci]"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              ok=1
              break
            fi
            echo "push gagal (percobaan $i)"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Gagal menyimpan jurnal ke repo setelah 3 percobaan"
            exit 1
          fi
          python -m scalp --config "config/${STRATEGY_PROFILE}.json" --data-dir data verify

      - name: Upload site artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-run
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
