name: Run Scalp Engine & Publish to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run unit tests
        run: |
          pytest -v

      - name: Restore scalp data & journal cache
        uses: actions/cache@v4
        with:
          path: data
          key: scalp-data-${{ github.run_id }}
          restore-keys: |
            scalp-data-

      - name: Run scalp analysis engine & build site
        env:
          API_KEY: ${{ secrets.API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p data _site
          python -m scalp --config config/strategy.json --data-dir data --site-src site --site-out _site run
          python -m scalp --config config/strategy.json --data-dir data --site-src site --site-out _site verify
          python -m scalp --config config/strategy.json --data-dir data --site-src site --site-out _site build-site

      - name: Commit updated data/journal (safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ] && ! git check-ignore -q data; then
            git add data/
            if ! git diff --staged --quiet; then
              git commit -m "chore: update scalp journal & state [skip ci]"
              git pull --rebase --autostash origin main || true
              git push origin main || echo "::warning::Git push dilewati; state tetap tersimpan aman di Actions Cache."
            fi
          fi

      - name: Upload site artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-run
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
