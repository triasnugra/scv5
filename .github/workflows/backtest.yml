name: Backtest (manual)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Jumlah hari ke belakang"
        default: "30"
      step_min:
        description: "Langkah scan (menit). Live = 15"
        default: "15"
      profile:
        description: "Profil strategi: strategy atau strategy.spot"
        default: "strategy"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backtest
        env:
          DAYS: ${{ inputs.days }}
          STEP: ${{ inputs.step_min }}
          PROFILE: ${{ inputs.profile }}
        run: |
          mkdir -p out
          python -m scalp --config "config/${PROFILE}.json" backtest --days "$DAYS" --step-min "$STEP" --out out/backtest.json | tee out/summary.txt
          { echo '### Ringkasan backtest'; echo '```'; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-result
          path: out/
